<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Dosen - SIM-CDP</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            background-color: #f8f9fa;
        }
        .menu-card {
            transition: transform 0.2s;
            height: 100%;
        }
        .menu-card:hover {
            transform: translateY(-5px);
        }
        .status-card {
            border-left: 4px solid;
        }
        .status-pending {
            border-left-color: #ffc107;
        }
        .status-approved {
            border-left-color: #198754;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-light bg-light">
        <div class="container">
            <span class="navbar-brand">SIM-CDP</span>
            <a href="../index.html" class="btn btn-danger">
                <i class="bi bi-box-arrow-right me-2"></i>Keluar
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-4">
        <!-- Status Section -->
        <div class="card status-card status-pending mb-4">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div>
                        <h5 class="card-title mb-1">Pengembangan Media Pembelajaran Berbasis AR</h5>
                        <p class="card-text text-muted mb-0">Status: Menunggu Verifikasi</p>
                    </div>
                    <div class="ms-auto">
                        <button class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-eye me-2"></i>Detail
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu Cards -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Proposal Card -->
            <div class="col">
                <div class="card menu-card">
                    <div class="card-body text-center">
                        <i class="bi bi-file-earmark-text text-primary fs-1 mb-3"></i>
                        <h5 class="card-title">Ajukan Proposal</h5>
                        <p class="card-text">Ajukan proposal CDP baru sebagai ketua atau anggota kelompok</p>
                        <a href="proposal.html" class="btn btn-primary">
                            <i class="bi bi-plus-circle me-2"></i>Ajukan
                        </a>
                    </div>
                </div>
            </div>

            <!-- Laporan Card -->
            <div class="col">
                <div class="card menu-card">
                    <div class="card-body text-center">
                        <i class="bi bi-journal-text text-success fs-1 mb-3"></i>
                        <h5 class="card-title">Upload Laporan</h5>
                        <p class="card-text">Unggah laporan kegiatan dan laporan keuangan CDP</p>
                        <a href="laporan.html" class="btn btn-success">
                            <i class="bi bi-upload me-2"></i>Upload
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

     <!-- Footer -->
     <footer class="footer">
        <div class="container">
            <small class="text-muted">developed by <a href="mailto:saintekonline@gmail.com" class="text-decoration-none">Unit SIM Fakultas SAINTEK @ 2025</a></small>
        </div>
    </footer>

    <style>
        .footer {
            margin-top: auto;
            padding: 10px;
            text-align: center;
            background-color: #f8f9fa;
        }
        .footer a {
            color: #6c757d;
        }
        .footer a:hover {
            color: #0d6efd;
        }
    </style>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
