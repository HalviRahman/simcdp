<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - SIM-CDP</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .footer {
            margin-top: auto;
            padding: 10px;
            text-align: center;
            background-color: #f8f9fa;
        }
        .footer a {
            color: #6c757d;
        }
        .footer a:hover {
            color: #0d6efd;
        }
        .dashboard-card {
            transition: transform 0.2s;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
        }
        .card-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-light bg-light">
        <div class="container">
            <span class="navbar-brand">SIM-CDP</span>
            <a href="../index.html" class="btn btn-danger">
                <i class="bi bi-box-arrow-right me-2"></i>Keluar
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-4">
        <div class="row g-4">
            <!-- Pengguna Card -->
            <div class="col-md-6">
                <div class="card h-100 dashboard-card">
                    <div class="card-body text-center">
                        <i class="bi bi-people-fill card-icon text-primary"></i>
                        <h5 class="card-title">Pengguna</h5>
                        <p class="card-text">Kelola data pengguna sistem</p>
                        <a href="pengguna.html" class="btn btn-primary">
                            <i class="bi bi-person-gear me-2"></i>Kelola Pengguna
                        </a>
                    </div>
                </div>
            </div>

            <!-- Program Studi Card -->
            <div class="col-md-6">
                <div class="card h-100 dashboard-card">
                    <div class="card-body text-center">
                        <i class="bi bi-building card-icon text-success"></i>
                        <h5 class="card-title">Program Studi</h5>
                        <p class="card-text">Kelola data program studi</p>
                        <a href="prodi.html" class="btn btn-success">
                            <i class="bi bi-building-gear me-2"></i>Kelola Prodi
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <small class="text-muted">developed by <a href="mailto:saintekonline@gmail.com" class="text-decoration-none">Unit SIM Fakultas SAINTEK @ 2025</a></small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
